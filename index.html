<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>美容師サクセス v0.3</title>
<style>
:root{--bg:#f7f7f9;--card:#fff;--line:#e5e7eb;--text:#111827;--muted:#6b7280;--accent:#111827;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text)}
.app{max-width:780px;margin:auto;padding:16px 14px 46px}
h1{font-size:25px;margin:8px 0 4px} .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}
input,select,button{font:inherit}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:11px;background:white}
button{border:0;border-radius:12px;background:var(--accent);color:white;padding:12px 14px;font-weight:700}
.hidden{display:none}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avatar{padding:0;background:white;border:2px solid transparent;border-radius:14px;overflow:hidden;aspect-ratio:1/1}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.selected{border-color:#111827;box-shadow:0 0 0 2px #fff inset}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px;background:#fafafa;border:1px solid var(--line);border-radius:12px}
.kpi .n{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafafa}
.stat .n{font-size:12px;color:var(--muted)} .stat .v{font-size:21px;font-weight:800}
.rank{font-size:12px;background:#e5e7eb;border-radius:999px;padding:2px 7px;margin-left:6px}
.bar{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:6px} .bar i{display:block;height:100%;background:#111827}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cmd{text-align:left;min-height:68px} .cmd small{display:block;font-weight:400;opacity:.8;margin-top:4px}
.log{font-size:14px;line-height:1.55;max-height:320px;overflow:auto} .log p{margin:6px 0;border-bottom:1px dashed #e5e7eb;padding-bottom:6px}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px 12px;border-radius:12px;font-size:13px}
.profile{display:flex;gap:12px;align-items:center} .profile img{width:82px;height:82px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef0f3;font-size:12px;margin-right:5px}
.good{color:#15803d} .warn{color:#b45309} .bad{color:#b91c1c}
@media(max-width:520px){.avatar-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<h1>美容師サクセス <span class="badge">v0.3</span></h1>
<div class="sub">顔を選び、生い立ちと就職先を決めて美容師人生を始めよう。</div>

<section id="create" class="card">
  <h2 style="font-size:18px;margin-top:0">キャラ作成</h2>
  <div class="grid2">
    <div><label>名前</label><input id="name" value="YU"></div>
    <div><label>性別</label><select id="gender"><option value="男性">男性</option><option value="女性">女性</option></select></div>
  </div>

  <div style="margin-top:14px"><label>顔アイコン</label><div id="avatars" class="avatar-grid"></div></div>

  <div class="grid2" style="margin-top:14px">
    <div><label>生い立ち</label>
      <select id="origin">
        <option>地方出身</option>
        <option>都会育ち</option>
        <option>美容師一家</option>
        <option>元スポーツ経験者</option>
        <option>ファッション好き</option>
        <option>苦労人</option>
      </select>
    </div>
    <div><label>所属サロン</label>
      <select id="salon">
        <option>大型有名サロン</option>
        <option>地域密着サロン</option>
        <option>個人店</option>
        <option>SNS特化サロン</option>
      </select>
    </div>
  </div>

  <div class="notice" style="margin-top:14px">
    あなたの「隠しタイプ」は開始時に内部で決定。最初は表示されず、1年目の途中で判明します。
  </div>
  <button id="start" style="width:100%;margin-top:12px">美容師人生を始める</button>
</section>

<section id="game" class="hidden">
  <div class="card">
    <div class="profile">
      <img id="avatarMain">
      <div>
        <div id="title" style="font-size:20px;font-weight:800"></div>
        <div id="meta" class="sub" style="margin:3px 0 6px"></div>
        <span id="typeBadge" class="badge">タイプ：？？？</span>
        <span id="dateBadge" class="badge"></span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="kpis">
      <div class="kpi"><div class="n">所持金</div><div id="money" class="v"></div></div>
      <div class="kpi"><div class="n">体力</div><div id="stamina" class="v"></div></div>
      <div class="kpi"><div class="n">ストレス</div><div id="stress" class="v"></div></div>
    </div>
    <div class="kpis" style="margin-top:8px">
      <div class="kpi"><div class="n">信用度</div><div id="trust" class="v"></div></div>
      <div class="kpi"><div class="n">店長評価</div><div id="boss" class="v"></div></div>
      <div class="kpi"><div class="n">カリスマ</div><div id="charisma" class="v"></div></div>
    </div>
  </div>

  <div class="card">
    <h2 style="font-size:18px;margin-top:0">基本能力</h2>
    <div id="stats" class="stats"></div>
  </div>

  <div class="card">
    <h2 style="font-size:18px;margin-top:0">今週、何をする？</h2>
    <div class="cmds">
      <button class="cmd" data-cmd="cut">カット練習<small>カット中心・センス微増</small></button>
      <button class="cmd" data-cmd="color">カラー練習<small>カラー中心・センス微増</small></button>
      <button class="cmd" data-cmd="perm">パーマ練習<small>パーマ中心</small></button>
      <button class="cmd" data-cmd="service">接客練習<small>接客・メンタル・信用</small></button>
      <button class="cmd" data-cmd="sns">SNS投稿<small>SNS・センス / 炎上あり</small></button>
      <button class="cmd" data-cmd="model">モデル施術<small>複数能力 / 成功・失敗あり</small></button>
      <button class="cmd" data-cmd="fashion">街・ファッション<small>センスUP / お金DOWN</small></button>
      <button class="cmd" data-cmd="rest">休む<small>体力回復・ストレスDOWN</small></button>
    </div>
  </div>

  <div class="card">
    <div class="row"><h2 style="font-size:18px;margin:0">デビュー判定</h2><button id="judge" style="background:#eef0f3;color:#111">判定</button></div>
    <div id="judgeText" style="margin-top:10px;font-size:14px"></div>
  </div>

  <div class="card"><h2 style="font-size:18px;margin-top:0">ログ</h2><div id="log" class="log"></div></div>
</section>
</div>

let selectedAvatar="a1", P=null;

function rnk(v){if(v>=95)return"S";if(v>=80)return"A";if(v>=70)return"B";if(v>=60)return"C";if(v>=50)return"D";if(v>=40)return"E";if(v>=20)return"F";return"G"}
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function avg(a){return a.reduce((x,y)=>x+y,0)/a.length}
function log(t,c=""){const p=document.createElement("p");p.textContent=t;if(c)p.className=c;document.getElementById("log").prepend(p)}

function renderAvatars(){
  const g=document.getElementById("gender").value;
  const ids=g==="男性"?["a1","a2","a3","a4"]:["a5","a6","a7","a8"];
  if(!ids.includes(selectedAvatar)) selectedAvatar=ids[0];
  const box=document.getElementById("avatars"); box.innerHTML="";
  ids.forEach(id=>{
    const b=document.createElement("button"); b.className="avatar"+(id===selectedAvatar?" selected":""); b.type="button";
    const im=document.createElement("img"); im.src=AVATARS[id]; b.appendChild(im);
    b.onclick=()=>{selectedAvatar=id;renderAvatars();};
    box.appendChild(b);
  });
}
document.getElementById("gender").onchange=renderAvatars; renderAvatars();

function start(){
  const typeNames=Object.keys(hiddenTypes);
  const hidden=typeNames[rnd(0,typeNames.length-1)];
  const origin=document.getElementById("origin").value;
  const o=origins[origin], t=hiddenTypes[hidden];
  const baseline=[39,39,37,40,41,36,41];
  let stats=baseline.map((v,i)=>clamp(v+t.base[i]+o.mod[i]+rnd(-2,2)));
  const salon=document.getElementById("salon").value;
  P={
    name:document.getElementById("name").value.trim()||"NO NAME",
    gender:document.getElementById("gender").value, avatar:selectedAvatar,
    origin, salon, hiddenType:hidden, revealed:false, stats,
    money:80000+o.money, stamina:75+o.stamina, stress:12,
    trust:35+o.trust, boss:salons[salon].boss, charisma:10, week:1, debut:false
  };
  document.getElementById("create").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  log(`${salon}に入社。${P.name}の美容師人生が始まった！`,"good");
  render();
}
document.getElementById("start").onclick=start;

function render(){
  document.getElementById("avatarMain").src=AVATARS[P.avatar];
  document.getElementById("title").textContent=`${P.name} / ${P.debut?"Jr.スタイリスト":"アシスタント"}`;
  document.getElementById("meta").textContent=`${P.gender}・${P.origin}｜${P.salon}`;
  document.getElementById("typeBadge").textContent="タイプ："+(P.revealed?P.hiddenType:"？？？");
  let m=Math.floor((P.week-1)/4)+4; let y=1;
  while(m>12){m-=12;y++;}
  document.getElementById("dateBadge").textContent=`${y}年目 ${m}月 ${((P.week-1)%4)+1}週`;
  document.getElementById("money").textContent=`¥${Math.max(0,P.money).toLocaleString()}`;
  document.getElementById("stamina").textContent=`${Math.round(P.stamina)}/100`;
  document.getElementById("stress").textContent=`${Math.round(P.stress)}/100`;
  document.getElementById("trust").textContent=`${Math.round(P.trust)}`;
  document.getElementById("boss").textContent=`${Math.round(P.boss)}`;
  document.getElementById("charisma").textContent=`${Math.round(P.charisma)}`;
  const box=document.getElementById("stats"); box.innerHTML="";
  P.stats.forEach((v,i)=>{
    const d=document.createElement("div");d.className="stat";
    d.innerHTML=`<div class="n">${STATN[i]}</div><div class="v">${Math.round(v)}<span class="rank">${rnk(v)}</span></div><div class="bar"><i style="width:${v}%"></i></div>`;
    box.appendChild(d);
  });
}

function mentalStress(base){
  const mental=P.stats[6];
  const factor=Math.max(.45,1.35-mental/100);
  return Math.round(base*factor);
}
function grow(i,amt){P.stats[i]=clamp(P.stats[i]+amt)}
function act(cmd){
  const T=hiddenTypes[P.hiddenType], S=salons[P.salon], mult=(T.mult[cmd]||1)*S.growth;
  const g=()=>Math.max(1,Math.round(rnd(1,3)*mult));
  if(cmd==="cut"){grow(0,g()); if(Math.random()<.35)grow(4,1);P.stamina-=10;P.stress+=mentalStress(3+S.stress);log("カット練習。技術を磨いた。")}
  if(cmd==="color"){grow(1,g()); if(Math.random()<.4)grow(4,1);P.stamina-=9;P.stress+=mentalStress(2+S.stress);log("カラー練習。色の感覚も少し磨かれた。")}
  if(cmd==="perm"){grow(2,g());P.stamina-=10;P.stress+=mentalStress(3+S.stress);log("パーマ練習をした。")}
  if(cmd==="service"){grow(3,g()); if(Math.random()<.65)grow(6,1);P.trust+=rnd(1,2);P.boss+=1;P.stamina-=6;P.stress+=mentalStress(2);log("接客練習。対人経験を積んだ。")}
  if(cmd==="sns"){
    grow(5,g()); if(Math.random()<.5)grow(4,1);P.stamina-=4;
    if(Math.random()<.10){P.stress+=mentalStress(14);P.trust-=2;log("投稿がプチ炎上…。","bad")}
    else if(Math.random()<.15){grow(5,2);P.charisma+=2;log("投稿が伸びた！知名度が上がった。","good")}
    else log("SNSを更新した。");
  }
  if(cmd==="model"){
    P.stamina-=14; const success=Math.random()*100 < avg(P.stats.slice(0,3)) + P.stats[4]*.25 + P.stats[6]*.1;
    const target=rnd(0,2);
    if(success){grow(target,Math.max(2,Math.round(3*mult)));grow(3,1);grow(4,1);P.trust+=2;P.boss+=2;P.charisma+=1;log("モデル施術成功！実戦経験が大きく伸びた。","good")}
    else{grow(target,1);P.stress+=mentalStress(10);P.trust-=1;log("モデル施術で失敗。でも経験にはなった。","bad")}
  }
  if(cmd==="fashion"){
    const cost=rnd(3000,9000);P.money-=cost;grow(4,Math.max(1,Math.round(2*mult)));if(Math.random()<.25)grow(5,1);P.stress=Math.max(0,P.stress-5);log(`街に出て感性を磨いた。¥${cost.toLocaleString()}使った。`);
  }
  if(cmd==="rest"){P.stamina+=28;P.stress-=15;log("しっかり休んだ。")}
  P.stamina=clamp(P.stamina);P.stress=clamp(P.stress);P.trust=clamp(P.trust);P.boss=clamp(P.boss);P.charisma=clamp(P.charisma);

  if(P.stress>=95){log("心身が限界に近い。休養が必要だ。","warn")}
  if(P.week===20 && !P.revealed){P.revealed=true;log(`中間評価：あなたは「${P.hiddenType}」タイプだと分かってきた！`,"good")}
  if(P.week%4===0){
    const sal=salons[P.salon].salary, living=120000;P.money+=sal-living;
    log(`月末：給料 ¥${sal.toLocaleString()} / 生活費 ¥${living.toLocaleString()}。`);
  }
  P.week++; render();
}
document.querySelectorAll("[data-cmd]").forEach(b=>b.onclick=()=>act(b.dataset.cmd));

document.getElementById("judge").onclick=()=>{
  const tech=P.stats.slice(0,3), techAvg=avg(tech), allAvg=avg(P.stats);
  const noG=tech.every(v=>v>=40);
  const ok=noG && techAvg>=45 && allAvg>=50 && P.boss>=35;
  const t=document.getElementById("judgeText");
  if(ok){P.debut=true;t.innerHTML='<strong class="good">Jr.スタイリストデビュー決定！</strong>';log("Jr.スタイリストデビュー！！","good");render()}
  else t.innerHTML=`技術3種E以上：${noG?"○":"×"} / 技術平均45以上：${techAvg>=45?"○":"×"} / 全体平均50以上：${allAvg>=50?"○":"×"} / 店長評価35以上：${P.boss>=35?"○":"×"}`;
};
</script>
